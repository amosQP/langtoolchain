name: SonarCloud analysis

# decision-13: SonarQube Cloud(Free 플랜, public repo) 채택. 모든 push/PR to main에서
# 돈다 - e2e-verify.yml과 달리 경로 필터가 없음(정적분석은 e2e처럼 실기기 컴파일이
# 필요한 게 아니라 몇 초~몇 십 초짜리 스캔이라, README/백로그만 바뀐 커밋에서도
# 돌려서 손해볼 게 없음).
#
# fork에서 온 PR은 secrets.SONAR_TOKEN에 접근 못 하므로(GitHub Actions의 기본 보안
# 정책), 그 경우는 스캔을 건너뛴다 - 실패로 표시하면 외부 기여자에게 혼란만 준다.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud가 커밋 히스토리(blame 등)를 참조하므로 얕은 clone이면 안 됨.
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
